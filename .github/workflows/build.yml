name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build Squelch.csproj -c Release

      # Framework-dependent single file (~1 MB): requires the .NET Desktop
      # Runtime (9.0, x64) on the machine that runs it.
      - name: Publish single-file build
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name }}' -replace '^v', ''
          dotnet publish Squelch.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishSingleFile=true `
            -p:SelfContained=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$version `
            -o publish

          Copy-Item publish/Squelch.exe "publish/Squelch-${{ github.event.release.tag_name }}-win-x64.exe"

      - name: Upload build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Squelch-win-x64
          path: bin/Release/net9.0-windows/
          if-no-files-found: error

      - name: Attach single-file build to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload '${{ github.event.release.tag_name }}' `
            "publish/Squelch-${{ github.event.release.tag_name }}-win-x64.exe" `
            --clobber
